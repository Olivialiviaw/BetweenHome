.dialog{background:#fff0d2;border-color:#f2d6ad;color:#245e80;box-shadow:10px 14px 50px #10374e45}.dialog-backdrop{background:#123b566e}.dialog h2{color:#c83c27}.dialog p,.dialog label,.dialog .muted,.detail-meta{color:#466e86}.dialog .eyebrow{color:#4e7b92}.dialog input,.dialog textarea,.dialog select{background:#fff8e9;border-color:#a8bdc3;color:#225b7c}.dialog input:focus,.dialog textarea:focus,.dialog select:focus{outline:2px solid #337da1;outline-offset:2px}.dialog input::placeholder,.dialog textarea::placeholder{color:#78909b}.dialog .pill{color:#286888;border-color:#92b0ba;background:transparent}.dialog .textbtn{color:#286888;border-color:#94b2bb}.choice{background:#f8e4c2;border-color:#c8bda8;color:#245e80}.choice.selected{background:#d4e3df;border-color:#2876a0}.choice strong{color:#245e80}.choice small{color:#54768a}.detail-icon{background:#d4e2df;color:#286d90}.stepdots i{background:#d8c7aa}.stepdots i.on{background:#d84a30}.close{color:#a23c2b}.success .big{color:#d4472e}.journey-visual span{color:#cf472d}.demo-mark{color:#e3e9db;border-color:#95b6c2}.dialog .demo-mark{color:#54768a;border-color:#9ab5bc}.toast{background:#c83c27;color:#fff4dc}.saved-label{color:#d2e3df}footer{color:#d3e1de;border-color:#82a9bb;background:transparent}button:focus-visible,a:focus-visible{outline-color:#ffc79d}.dialog button:focus-visible{outline-color:#2876a0}

.nav .pill{background:#d53b24;border-color:#d53b24;color:#fff4d9}.nav .pill:hover{background:#bc301c;border-color:#bc301c}</style></head><body><header><button class="brand" onclick="goHome()" aria-label="Home archive"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 11 9-8 9 8v10h-7v-6h-4v6H3Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg><span>BETWEEN HOME</span></button><nav class="nav"><button id="archiveNav" class="active" onclick="goHome()">My homes</button><button onclick="about()">About</button><button class="pill" onclick="newHome()">＋ Create a home</button></nav></header><main id="app"></main><footer><span>BETWEEN HOME / A PERSONAL ARCHIVE</span><span>LOCAL COLLECTION ·  <button class="textbtn" onclick="exportArchive()">Export archive ↗</button></span></footer><div id="modal"></div><div id="toast" role="status" class="toast hidden"></div>
<script>
const uid=()=>globalThis.crypto?.randomUUID?.()||'home-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);const STORE='little-home-archive-v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null,selected=[],moveStep=0,source=null,uploaded=null;
const seed=[{id:'demo-blue',name:'The blue-curtain room',place:'NEW YORK',period:'2024 — 2025',color:'#d5d7ce',demo:true,memories:[{id:'cup',title:'The morning cup',type:'object',icon:'☕',note:'Always on the windowsill, always a little too hot. A small beginning to an ordinary day.',tag:'A SMALL OBJECT'},{id:'read',title:'Ten pages before sleep',type:'habit',icon:'📖',note:'A lamp, a quiet room, a few pages. A habit I would like to keep wherever I go.',tag:'AN EVERYDAY RITUAL'},{id:'rain',title:'Rain against the window',type:'sound',icon:'☂',note:'The sound that made this unfamiliar room feel sheltered. Close your eyes and listen.',tag:'A SOUND I REMEMBER'},{id:'sunday',title:'Slow Sunday mornings',type:'memory',icon:'✷',note:'No alarm. The light moved across the floor before I decided to get up.',tag:'A MOMENT IN TIME'}]},{id:'demo-lilac',name:'A room of my own',place:'SOMEWHERE NEW',period:'2026 —',color:'#dedad6',demo:true,memories:[{id:'key',title:'The first key',type:'object',icon:'⚿',note:'A new door. A room that is still becoming familiar.',tag:'A NEW BEGINNING'}]}];let homes;try{homes=JSON.parse(localStorage.getItem(STORE))||structuredClone(seed)}catch{homes=structuredClone(seed)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(homes));return true}catch{toast('Your browser is full. Try a smaller photo or export your archive.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function icon(type){const paths={object:'<path d="M6 9h15v10a6 6 0 0 1-6 6h-3a6 6 0 0 1-6-6Z"/><path d="M21 11h3a4 4 0 0 1 0 8h-3M5 28h20M10 3v3m6-3v3"/>',habit:'<path d="M16 7q-6-5-12-2v21q6-3 12 2 6-5 12-2V5q-6-3-12 2Zm0 0v21M8 10l4 1m-4 5 4 1m8-6 4-1m-4 7 4-1"/>',sound:'<path d="M4 14v4m4-9v14m4-17v20m4-15v10m4-17v24m4-20v16m4-10v4"/>',memory:'<rect x="5" y="5" width="22" height="22" rx="1"/><path d="m5 22 7-8 6 5 4-4 5 6"/><circle cx="21" cy="11" r="2"/>',home:'<path d="m3 14 13-11 13 11M6 12v17h20V12M13 29V18h7v11M10 5V2h5v3"/>',key:'<circle cx="11" cy="11" r="6"/><path d="m15 15 13 13m-5-5 3-3m-7-1 3-3"/>',stack:'<path d="m3 10 13-7 13 7-13 7Zm0 7 13 7 13-7M3 24l13 7 13-7"/>',grid:'<rect x="4" y="4" width="9" height="9"/><rect x="19" y="4" width="9" height="9"/><rect x="4" y="19" width="9" height="9"/><rect x="19" y="19" width="9" height="9"/>'};return '<svg class="line-icon" viewBox="0 0 32 34" aria-hidden="true">'+(paths[type]||paths.memory)+'</svg>'}
function memoryIcon(m){return icon(m.id==='key'?'key':m.type)}
let archiveView='grid';function setArchiveView(v){archiveView=v;goHome()}
function folderPreview(h,i,empty=false){return `<div class="folder-preview" style="background:${empty?'transparent':h.color+'50'}"><span class="file-corner">BH / ${String(i+1).padStart(3,'0')}</span>${h.photo?`<img src="${h.photo}" alt="${esc(h.name)}">`:house(h.color,empty)}<span class="file-stamp">${h.memories?.length||0} RECORDS · HOME ARCHIVE</span></div>`}
function house(color='#d1d3c8',empty=false){if(!empty)return `<svg class="house-art" viewBox="0 0 320 270" aria-hidden="true"><image href="assets/house-simple-${color==='#dedad6'||color==='#e0dbd7'?'red':'blue'}.webp" x="0" y="20" width="320" height="230"/></svg>`;return `<svg class="house-art" viewBox="0 0 320 270" fill="none" aria-hidden="true"><g stroke="#8a916b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M76 224V123L153 63l83 63v98Z" fill="#e3dfbf" fill-opacity=".35"/><path d="m62 130 90-78 99 79M152 53l84 73M202 89V61h17v42"/><path d="M135 224v-66h37v66M92 142h28v33H92Zm96 0h28v33h-28ZM106 142v33m-14-17h28m82-16v33m-14-17h28M74 229h166"/><path d="M145 185h17m-8-8v17"/></g></svg>`}

function goHome(){current=null;$('#app').innerHTML=`<section class="storybook-hero enter"><div class="eyebrow">A little archive of the places we call home</div><h1>Every home leaves<br>a little of itself.</h1><p>And a little comes with you.</p><div class="hero-note">Keep a familiar object, an ordinary ritual, a small memory.<br>Let them find a place in your next chapter.</div></section><section class="collection-bar"><span>YOUR PLACES <i>(${String(homes.length).padStart(2,'0')})</i></span><div class="story-views"><button class="${archiveView==='grid'?'chosen':''}" onclick="setArchiveView('grid')">${icon('grid')} Side by side</button><button class="${archiveView==='stacked'?'chosen':''}" onclick="setArchiveView('stacked')">${icon('stack')} A little stack</button></div></section><section class="map story-map ${archiveView==='stacked'?'stacked':''}" aria-label="Your home folders">${homes.map((h,i)=>`<button class="house-card" style="--index:${i}" onclick="openHome('${h.id}')"><div class="painted-house">${h.photo?`<img src="${h.photo}" class="own-photo" alt="${esc(h.name)}">`:`<img src="assets/house-simple-${i%2===0?'blue':'red'}.webp" alt="A simple hand-painted open home">`}</div><span class="record-number">HOME ${String(i+1).padStart(2,'0')}${h.demo?' · EXAMPLE':''}</span><h3>${esc(h.name)}</h3><p>${esc(h.place)} · ${esc(h.period||'A CHAPTER OF YOUR LIFE')}</p><span class="memory-count">${h.memories.length} small ${h.memories.length===1?'memory':'memories'} held here</span></button>`).join('')}<button class="house-card new-house" onclick="newHome()"><div class="new-home-drawing">${house('#c4cba9',true)}</div><h3>A place to begin</h3><p>CREATE YOUR OWN HOME ＋</p><span class="memory-count">There is room for your story.</span></button></section><section class="story-bottom"><p>A home can be a room, a corner, or a whole chapter.</p><button class="textbtn" onclick="openHome('demo-blue')">New here? Step inside an example home ↗</button></section>`}
function roomSVG(){const n=homes.findIndex(h=>h.id===current);return `<div class="room-painting"><img src="assets/house-simple-${n%2===0?'blue':'red'}.webp" alt="A painted home holding your memories"><span>A HOME, HELD IN LITTLE THINGS</span></div>`}
function openHome(id){const h=homes.find(x=>x.id===id);if(!h)return goHome();current=id;$('#app').innerHTML=`<section class="room-head enter"><button class="crumb" onclick="goHome()">← My homes</button><div class="room-title"><div><div class="eyebrow">${esc(h.place)} · ${esc(h.period)} ${h.demo?'<span class="demo-mark">FICTIONAL DEMO</span>':''}</div><h1>${esc(h.name)}</h1><p>${h.memories.length} little pieces of life, held in one place.</p></div><div class="room-actions"><button class="pill" onclick="addMemory()">＋ Add a memory</button><button class="solid" onclick="startMove()">Bring something along ↗</button></div></div></section><section class="canvas enter" id="roomCanvas">${h.photo?`<img class="room-image" src="${h.photo}" alt="Your uploaded room">`:roomSVG()}${h.memories.slice(0,4).map(m=>`<button class="memory" draggable="true" data-memory="${m.id}" onclick="memoryDetail('${m.id}')"><span class="tape"></span>${m.photo?`<img src="${m.photo}" alt="${esc(m.title)}">`:`<span class="icon">${memoryIcon(m)}</span>`}<span class="small muted" style="font-size:7px">${esc(m.tag||m.type)}</span><h3>${esc(m.title)}</h3><p>${m.from?'Carried from another home ↗':'Open this little memory ↗'}</p></button>`).join('')}<span class="canvas-label">A ROOM, STILL BECOMING</span></section>${h.memories.length>4?`<section style="margin:20px 5%;display:flex;gap:12px;flex-wrap:wrap">${h.memories.slice(4).map(m=>`<button class="pill" onclick="memoryDetail('${m.id}')">${memoryIcon(m)} ${esc(m.title)}</button>`).join('')}</section>`:''}<section class="prompt-strip"><div><h3>You don’t have to leave everything behind.</h3><p>A familiar object. An ordinary ritual. Choose a small piece to carry into your next home.</p></div><button class="textbtn" onclick="editHome()">Edit this home ↗</button></section>`;$('#roomCanvas').addEventListener('dragover',e=>e.preventDefault());$('#roomCanvas').addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain'),card=document.querySelector(`[data-memory="${id}"]`);if(card){const r=$('#roomCanvas').getBoundingClientRect();card.style.left=Math.max(0,Math.min(r.width-170,e.clientX-r.left-70))+'px';card.style.top=Math.max(0,Math.min(r.height-160,e.clientY-r.top-50))+'px';card.style.right='auto';card.style.bottom='auto'}});document.querySelectorAll('[draggable]').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.memory)))}
function modal(html,wide=false){$('#modal').innerHTML=`<div class="dialog-backdrop"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true"><button class="close" aria-label="Close" onclick="closeModal()">×</button>${html}</section></div>`;setTimeout(()=>$('#modal input, #modal textarea, #modal .solid')?.focus(),50)}function closeModal(){$('#modal').innerHTML='';stopRain()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#modal').addEventListener('click',e=>{if(e.target.classList.contains('dialog-backdrop'))closeModal()});
function newHome(after=null){uploaded=null;modal(`<div class="eyebrow">A new chapter</div><h2>Give this place<br>a little room.</h2><p>A whole house or just your favorite corner. Start with a name; add the rest whenever you’re ready.</p><form id="homeForm"><label for="hn">A name for this home</label><input id="hn" required maxlength="65" placeholder="The room with the afternoon light"><label for="hp">City or a place in your life</label><input id="hp" maxlength="45" placeholder="New York, or simply ‘my first room’"><label for="hd">When did you live here?</label><input id="hd" maxlength="35" placeholder="2026 —"><label for="hc">A color that feels like this place</label><select id="hc"><option value="#d5d7ce">Mist blue</option><option value="#dedad6">Quiet lilac</option><option value="#cbd3bd">Soft sage</option><option value="#e2d2bf">Warm sand</option></select><label for="hphoto">A room photo (optional, up to 8 MB)</label><input id="hphoto" type="file" accept="image/*"><p style="font-size:10px">You can begin without a photo. Spatial scanning is a future exploration.</p><button class="solid" type="submit">Create this home ↗</button></form>`);$('#hphoto').onchange=async e=>{uploaded=await readPhoto(e.target.files[0])};$('#homeForm').onsubmit=e=>{e.preventDefault();const h={id:uid(),name:$('#hn').value.trim(),place:$('#hp').value.trim()||'A PLACE OF MY OWN',period:$('#hd').value.trim(),color:$('#hc').value,photo:uploaded,memories:[]};if(!h.name)return;homes.push(h);save();closeModal();if(after){moveTarget(h.id)}else{openHome(h.id);toast('A little space for your next chapter.')}}}
async function readPhoto(file){if(!file)return null;if(file.size>8*1024*1024){toast('Please choose a photo smaller than 8 MB.');return null}return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,1200/im.width,1200/im.height);c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
function addMemory(){uploaded=null;modal(`<div class="eyebrow">Keep a little piece</div><h2>What made it yours?</h2><form id="memForm"><label for="mt">Give this memory a name</label><input id="mt" required maxlength="60" placeholder="Tea by the window"><label for="mtype">What kind of memory?</label><select id="mtype"><option value="object">An object</option><option value="habit">A habit or ritual</option><option value="sound">A sound</option><option value="memory">A moment</option></select><label for="mn">A few words about it</label><textarea id="mn" placeholder="What do you want to remember?"></textarea><label for="mp">Add a photo (optional)</label><input id="mp" type="file" accept="image/*"><button class="solid" type="submit">Place it in this home ↗</button></form>`);$('#mp').onchange=async e=>uploaded=await readPhoto(e.target.files[0]);$('#memForm').onsubmit=e=>{e.preventDefault();const type=$('#mtype').value;homes.find(h=>h.id===current).memories.push({id:uid(),title:$('#mt').value.trim(),type,note:$('#mn').value,photo:uploaded,icon:{object:'☕',habit:'📖',sound:'☂',memory:'✷'}[type],tag:'A PERSONAL '+type.toUpperCase()});save();closeModal();openHome(current);toast('A little piece, kept.')}}
function memoryDetail(id){const h=homes.find(h=>h.id===current),m=h.memories.find(m=>m.id===id);modal(`<div class="eyebrow">${esc(m.tag||m.type)}</div><h2>${esc(m.title)}</h2>${m.photo?`<img class="photo-preview" src="${m.photo}" alt="${esc(m.title)}">`:`<div class="detail-icon">${memoryIcon(m)}</div>`}<p style="white-space:pre-wrap">${esc(m.note||'A small piece of this place.')}</p>${m.from?`<div class="note-line"><p>Carried from <strong>${esc(m.from)}</strong></p><p>${esc(m.plan||'')}</p></div>`:''}${m.type==='sound'&&h.demo?'<button class="pill" onclick="toggleRain(this)">▷ Listen to a gentle rain sketch</button><p style="font-size:9px">An illustrative sound, synthesized for this demo.</p>':''}<button class="solid" onclick="startMove('${m.id}')">Bring this along ↗</button><div style="margin-top:18px"><button class="textbtn" onclick="editMemory('${m.id}')">Edit this memory</button></div>`)}
function editMemory(id){const h=homes.find(h=>h.id===current),m=h.memories.find(m=>m.id===id);modal(`<div class="eyebrow">A changing memory</div><h2>Make room for your words.</h2><form id="editMem"><label for="emt">Title</label><input id="emt" required maxlength="60" value="${esc(m.title)}"><label for="emn">Your note</label><textarea id="emn">${esc(m.note)}</textarea><button class="solid" type="submit">Save changes</button></form><button class="textbtn" style="margin-top:20px" onclick="removeMemory('${id}')">Remove this memory</button>`);$('#editMem').onsubmit=e=>{e.preventDefault();m.title=$('#emt').value;m.note=$('#emn').value;save();closeModal();openHome(current)}}
function removeMemory(id){const h=homes.find(h=>h.id===current);h.memories=h.memories.filter(m=>m.id!==id);save();closeModal();openHome(current);toast('Memory removed from this home.')}
function editHome(){const h=homes.find(h=>h.id===current);modal(`<div class="eyebrow">This place, in your words</div><h2>Edit your home.</h2><form id="editHF"><label for="ehn">Name</label><input id="ehn" required value="${esc(h.name)}"><label for="ehp">Place</label><input id="ehp" value="${esc(h.place)}"><label for="ehd">Dates</label><input id="ehd" value="${esc(h.period)}"><button class="solid" type="submit">Save changes</button></form>`);$('#editHF').onsubmit=e=>{e.preventDefault();h.name=$('#ehn').value;h.place=$('#ehp').value;h.period=$('#ehd').value;save();closeModal();openHome(current)}}
function startMove(id){source=current;selected=id?[id]:[];moveStep=0;showMove()}
function showMove(){const h=homes.find(x=>x.id===source);modal(`<div class="eyebrow">Between here and there · 01 / 03</div><h2>What comes with you?</h2><p>Choose a familiar object or an everyday ritual. Its original memory stays safely in this home.</p><div class="choice-grid">${h.memories.map(m=>`<button class="choice ${selected.includes(m.id)?'selected':''}" onclick="selectMove('${m.id}')"><span class="symbol">${memoryIcon(m)}</span><strong>${esc(m.title)}</strong><small>${selected.includes(m.id)?'✓ IN YOUR LITTLE SUITCASE':'Choose this little piece'}</small></button>`).join('')}</div>${!h.memories.length?'<p>Add a memory to this home first.</p>':''}<button class="solid" onclick="chooseDestination()" ${!selected.length?'disabled style="opacity:.4"':''}>Pack ${selected.length||'a'} little piece${selected.length>1?'s':''} →</button><div class="stepdots"><i class="on"></i><i></i><i></i></div>`,true)}function selectMove(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];showMove()}
function chooseDestination(){if(!selected.length)return;modal(`<div class="eyebrow">Between here and there · 02 / 03</div><h2>Where are you going?</h2><p>Choose a home for this next chapter.</p><div class="choice-grid">${homes.filter(h=>h.id!==source).map(h=>`<button class="choice" onclick="moveTarget('${h.id}')">${house(h.color)}<strong>${esc(h.name)}</strong></button>`).join('')}<button class="choice" onclick="newHome(true)">${house('',true)}<strong>Create a new home</strong></button></div><button class="textbtn" onclick="showMove()">← Back to your suitcase</button><div class="stepdots"><i class="on"></i><i class="on"></i><i></i></div>`,true)}
function moveTarget(id){const from=homes.find(h=>h.id===source),to=homes.find(h=>h.id===id);modal(`<div class="eyebrow">Between here and there · 03 / 03</div><h2>A familiar thing.<br>A new place for it.</h2><div class="journey-visual">${house(from.color)}<span>···→</span>${house(to.color)}</div><p>${selected.map(mid=>esc(from.memories.find(m=>m.id===mid)?.title)).join(' & ')} will connect these two homes.</p><form id="planForm"><label for="plan">How could you make room for it here?</label><textarea id="plan" placeholder="I could make tea by the new window tomorrow morning…"></textarea><button class="solid" type="submit">Bring it into this home ↗</button></form><div class="stepdots"><i class="on"></i><i class="on"></i><i class="on"></i></div>`,true);$('#planForm').onsubmit=e=>{e.preventDefault();const plan=$('#plan').value;selected.forEach(mid=>{const m=from.memories.find(m=>m.id===mid);if(m)to.memories.push({...m,id:uid(),from:from.name,sourceId:m.id,plan})});save();modal(`<div class="success"><div class="eyebrow">A little continuity</div><div class="big">${icon('home')}</div><h2>Something familiar<br>has arrived.</h2><p>Your old home keeps its memories.<br>Your new home has room for what comes next.</p><button class="solid" onclick="closeModal();openHome('${id}')">Step inside your next home ↗</button></div>`)} }
let audioCtx=null,rainNode=null;function toggleRain(btn){if(audioCtx){stopRain();btn.textContent='▷ Listen to a gentle rain sketch';return}audioCtx=new(window.AudioContext||window.webkitAudioContext)();const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.3;rainNode=audioCtx.createBufferSource();rainNode.buffer=buffer;rainNode.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=950;const gain=audioCtx.createGain();gain.gain.value=.22;rainNode.connect(filter).connect(gain).connect(audioCtx.destination);rainNode.start();btn.textContent='Ⅱ Pause rain'}function stopRain(){if(audioCtx){audioCtx.close();audioCtx=null;rainNode=null}}
function exportArchive(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({title:'BETWEEN HOME',exported:new Date().toISOString(),homes},null,2)],{type:'application/json'}));a.download='between-home-archive.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Your home archive has been exported.')}
function about(){modal(`<div class="eyebrow">An exploration of moving & belonging</div><h2>A place for what<br>comes with us.</h2><div class="about"><p>Moving changes our surroundings. A favorite cup, an evening ritual, a familiar sound: small things can become threads between one chapter and the next.</p><p>This prototype explores how a digital home archive might make those threads visible. Collect a memory, give it a place, and decide what you want to carry forward.</p><div class="note-line"><p>The two starter homes and their stories are fictional examples. You can create your own without sharing exact addresses or personal photographs.</p></div><p>Your additions are stored only in this browser. They are not uploaded to a server or synchronized across devices. Export a copy to keep your archive.</p><p>Prototype I · Olivia Tang<br>Parsons Communication Design · Fall 2026</p></div><button class="solid" onclick="closeModal()">Make yourself at home</button>`)}
goHome();
</script></body></html>
